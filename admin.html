<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biswajit — Admin Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 30px;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
  box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

h1 {
  margin: 0;
  font-size: 25px;
}

.subtitle {
  margin: 7px 0 25px;
  color: #6b7280;
  font-size: 14px;
}

.field {
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #2563eb;
}

button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#error {
  display: none;
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  background: #fee2e2;
  color: #b91c1c;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="login-card">

  <h1>Biswajit</h1>

  <div class="subtitle">
    Admin Login
  </div>

  <form id="loginForm">

    <div class="field">
      <label>Username</label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        required
      >
    </div>

    <div class="field">
      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >
    </div>

    <button id="loginButton" type="submit">
      Login
    </button>

    <div id="error"></div>

  </form>

</div>

<script>

const API =
  "https://biswajit-tree.dakshdetwal10.workers.dev";

const form =
  document.getElementById("loginForm");

const button =
  document.getElementById("loginButton");

const errorBox =
  document.getElementById("error");


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  errorBox.style.display = "none";

  button.disabled = true;
  button.textContent = "Logging in...";

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  try {

    const response =
      await fetch(API + "/api/login", {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      });

    const data =
      await response.json();

    if (!response.ok) {

      errorBox.textContent =
        data.error ||
        "Invalid username or password.";

      errorBox.style.display = "block";

      return;
    }

    window.location.href = "./";

  } catch (error) {

    console.error(error);

    errorBox.textContent =
      "Could not connect to the server.";

    errorBox.style.display = "block";

  } finally {

    button.disabled = false;
    button.textContent = "Login";
  }

});

</script>

</body>
</html>
